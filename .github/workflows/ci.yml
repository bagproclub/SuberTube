name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality Gate, Security Check, and Signed APK Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 2. Set up Node.js 20
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      # 3. Quality Gate & Security Preflight ใน Clean Export
      - name: Run Quality Gate, Security Preflight & Integrity Verification
        run: |
          mkdir -p /tmp/clean-source
          git archive HEAD | tar -x -C /tmp/clean-source
          cd /tmp/clean-source
          
          echo "=== 1. Node Quality Gate (npm test) ==="
          npm test
          
          echo "=== 2. Security Preflight (npm run security) ==="
          npm run security
          
          echo "=== 3. Release Integrity & SHA Manifest (npm run integrity) ==="
          npm run integrity
          
          # คัดลอก Manifest กลับมารวมใน artifact
          cp RELEASE-SHA256SUMS.txt "$GITHUB_WORKSPACE/RELEASE-SHA256SUMS.txt"

      # 4. Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Set up Android SDK (ติดตั้ง Platform 36 และ Build Tools 36 ผ่าน Action โดยตรง)
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # 6. Set up Gradle 9.6.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@7662c19a9e33465dd8a06e9352e805fe9c19b674
        with:
          gradle-version: 9.6.0

      # 7. ถอดรหัส Keystore จาก Secret
      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
        run: |
          KEY_PATH="${KEYSTORE_PATH:-keystore.jks}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "android/app/$KEY_PATH"
            chmod 600 "android/app/$KEY_PATH"
            echo "Release keystore decoded to android/app/$KEY_PATH"
          else
            echo "::warning::KEYSTORE_BASE64 is empty. Build may fail if release keystore is required."
          fi

      # 8. สั่ง Build APK ด้วย Gradle 9.6.0 โดยตรง
      - name: Build Release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle :app:assembleRelease --no-daemon

      # 9. ตรวจสอบไฟล์ APK
      - name: Verify Release APK Output
        run: |
          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          
          if [ -f "$APK_FILE" ]; then
            echo "APK generated: $APK_FILE"
            ls -lh "$APK_FILE"
            mkdir -p staging-release
            cp "$APK_FILE" staging-release/app-release.apk
            cp "$GITHUB_WORKSPACE/RELEASE-SHA256SUMS.txt" staging-release/RELEASE-SHA256SUMS.txt
          else
            echo "::error::Release APK output file not found"
            exit 1
          fi

      # 10. อัปโหลด Artifact
      - name: Upload Release APK & Integrity Manifest
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: app-release
          path: staging-release/
          if-no-files-found: error
          retention-days: 14

      # 11. ล้างข้อมูล Keystore ทิ้งเสมอ
      - name: Security Cleanup
        if: always()
        run: |
          KEY_PATH="${{ secrets.KEYSTORE_PATH }}"
          [ -z "$KEY_PATH" ] && KEY_PATH="keystore.jks"
          rm -f "android/app/$KEY_PATH"
          rm -rf /tmp/clean-source staging-release
          echo "Keystore and temporary build artifacts cleaned up."
