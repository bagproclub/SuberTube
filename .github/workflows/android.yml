{
  "command": "cat << 'EOF' > /mnt/documents/build-release-apk.yml\nname: Android Release Build\n\non:\n  push:\n    branches: [ \"main\", \"master\" ]\n  workflow_dispatch:\n\nconcurrency:\n  group: ${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  build:\n    name: Quality Gate, Security Check, and Signed APK Build\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n\n      # -------------------------------------------------------------\n      # 1. Node.js Quality Gate & Security Preflight (No secrets exposed)\n      # -------------------------------------------------------------\n      - name: Set up Node.js 20\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n\n      # ป้องกันปัญหา .git ค้าง: รันการตรวจสอบใน clean export sandbox\n      - name: Run Quality Gate, Security Preflight & Integrity Verification\n        run: |\n          mkdir -p /tmp/clean-source\n          git archive HEAD | tar -x -C /tmp/clean-source\n          cd /tmp/clean-source\n          \n          echo \"=== 1. Node Quality Gate (npm test) ===\"\n          npm test\n          \n          echo \"=== 2. Security Preflight (npm run security) ===\"\n          npm run security\n          \n          echo \"=== 3. Release Integrity & SHA Manifest (npm run integrity) ===\"\n          npm run integrity\n          \n          # คัดลอก Manifest ที่ผ่านการ verify กลับมารวมใน artifact\n          cp RELEASE-SHA256SUMS.txt \"$GITHUB_WORKSPACE/RELEASE-SHA256SUMS.txt\"\n\n      # -------------------------------------------------------------\n      # 2. Android Build Toolchain Setup\n      # -------------------------------------------------------------\n      - name: Set up JDK 17\n        uses: actions/setup-java@v4\n        with:\n          distribution: 'temurin'\n          java-version: '17'\n\n      - name: Set up Android SDK\n        uses: android-actions/setup-android@v3\n\n      - name: Accept Android SDK Licenses & Install SDK 36\n        run: |\n          yes | sdkmanager --licenses || true\n          sdkmanager \"platforms;android-36\" \"build-tools;36.0.0\"\n\n      - name: Set up Gradle 9.6.0\n        uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: '9.6.0'\n\n      # -------------------------------------------------------------\n      # 3. Secure Keystore Injection (เฉพาะก่อน build เท่านั้น)\n      # -------------------------------------------------------------\n      - name: Decode Release Keystore\n        env:\n          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}\n        run: |\n          if [ -z \"$KEYSTORE_BASE64\" ]; then\n            echo \"::error::RELEASE_KEYSTORE_BASE64 secret is not defined in repository settings!\"\n            exit 1\n          fi\n          \n          # กรอง whitespace/carriage return และจำกัดสิทธิ์ไฟล์\n          echo \"$KEYSTORE_BASE64\" | tr -d '\\r\\n ' | base64 -d > android/app/keystore.jks\n          chmod 600 android/app/keystore.jks\n          \n          if [ ! -s android/app/keystore.jks ]; then\n            echo \"::error::Decoded keystore is empty or invalid binary!\"\n            exit 1\n          fi\n\n      # -------------------------------------------------------------\n      # 4. Build Signed Release APK\n      # -------------------------------------------------------------\n      - name: Build Release APK\n        working-directory: ./android\n        env:\n          KEYSTORE_PATH: keystore.jks\n          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}\n          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}\n          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}\n        run: |\n          chmod +x gradlew\n          ./gradlew :app:assembleRelease --stacktrace --no-daemon\n\n      - name: Verify Release APK Output\n        run: |\n          test -f android/app/build/outputs/apk/release/app-release.apk\n          ls -lh android/app/build/outputs/apk/release/app-release.apk\n\n      # -------------------------------------------------------------\n      # 5. Upload Verified Artifacts\n      # -------------------------------------------------------------\n      - name: Upload Release Artifacts\n        uses: actions/upload-artifact@v4\n        with:\n          name: subertube-release-bundle\n          path: |\n            android/app/build/outputs/apk/release/app-release.apk\n            RELEASE-SHA256SUMS.txt\n          retention-days: 14\n          if-no-files-found: error\n\n      # -------------------------------------------------------------\n      # 6. Always Cleanup Secrets & Keystore (ทำงานเสมอแม้ Job Fail)\n      # -------------------------------------------------------------\n      - name: Secure Cleanup Keystore & Temporary Files\n        if: always()\n        run: |\n          # ล้างไฟล์ keystore ออกจาก runner disk\n          rm -f android/app/keystore.jks\n          rm -rf /tmp/clean-source\n          echo \"Keystore and temporary test environments successfully purged.\"\nEOF\n",
  "user_facing_description": "Writing complete hardened build-release-apk.yml",
  "timeout": 60
}