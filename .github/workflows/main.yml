**Pull Request / Issue Tracker: ปรับปรุงระบบคำสั่งแกนกลางและการแก้ไขไฟล์ (Core Command System Fix)**
**รายละเอียดของปัญหา (Problem Statement)**
ระบบคำสั่งแกนกลาง (Core Command System) ในส่วนของการแก้ไขไฟล์ทำงานไม่สมบูรณ์ ส่งผลให้การอัปเดตหรือเขียนข้อมูลลงไฟล์เกิดข้อผิดพลาด ซึ่งความไม่สมบูรณ์ในระดับแกนกลางนี้อาจสร้างผลกระทบลูกโซ่ต่อการบิลด์และการทำงานของระบบในภาพรวม
**การวิเคราะห์ผลกระทบต่อภาพรวมระบบ (Architectural Impact)**
 * หากระบบการแก้ไขไฟล์ทำงานผิดพลาด อาจส่งผลโดยตรงต่อความสมบูรณ์ของ Web Core ที่ถูกรวมไว้ภายใต้พาธ android/app/src/main/assets/
 * การปรับปรุงไฟล์ที่ไม่สมบูรณ์อาจทำให้กระบวนการซิงค์ Gradle ผ่าน Android Gradle Plugin เกิดความล้มเหลวเมื่อเปิดโปรเจกต์ด้วย Android Studio
**แนวทางการแก้ไข (Proposed Solution)**
 1. **แก้บั๊กเฉพาะจุด:** ตรวจสอบและปรับปรุงสคริปต์แกนกลางที่ควบคุมการเขียนและแก้ไขไฟล์ให้มีการยืนยันความสมบูรณ์ (Validation) ทุกครั้งหลังทำรายการ
 2. **รักษาโครงสร้างสถาปัตยกรรม:** ควบคุมให้การแก้ไขในระดับแกนกลางไม่ส่งผลกระทบต่อกระบวนการรันไทม์ที่คาดหวังไว้ (Expected runtime flow) ซึ่งได้แก่ลำดับ SuberTube → Header → Search → Official YouTube Search inside the WebView
 3. **ป้องกันการละเมิดขอบเขต:** ตรวจสอบให้แน่ใจว่าระบบคำสั่งที่แก้ไขไฟล์ จะไม่ไปทำลายการเชื่อมโยงของระบบนำทาง (Navigation layer) ที่ทำหน้าที่แมปกลับไปยัง /assets/index.html เพื่อรักษาความปลอดภัยไม่ให้หลุดออกจาก Origin ของแอปพลิเคชัน
**ขั้นตอนการทดสอบ (Verification Steps)**
 * [ ] ทดสอบรันระบบคำสั่งแกนกลางเพื่อให้ดำเนินการแก้ไขไฟล์ และตรวจสอบความถูกต้องของเนื้อหาไฟล์
 * [ ] เปิดไดเรกทอรี android/ ใน Android Studio เพื่อทดสอบให้กระบวนการซิงค์ Gradle ทำงานจนเสร็จสมบูรณ์
 * [ ] สั่งรันการตั้งค่า app หรือสร้าง Debug APK เพื่อนำไปติดตั้งบนอุปกรณ์ทดสอบ
 * [ ] ทดสอบใช้งานแอปพลิเคชันเพื่อยืนยันว่าการนำทางภายใน WebView (รวมถึงการเล่นวิดีโอแบบเต็มหน้าจอหรือ PiP) ยังคงทำงานได้ตามปกติโดยไม่มีข้อจำกัดทางสถาปัตยกรรมถูกละเมิด
