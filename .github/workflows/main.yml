name: SuberTube Project Control

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

concurrency:
  group: subertube-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "24"
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:

  # ============================================================
  # 1. DISCOVER
  # อ่านสิ่งที่มีจริงก่อน ไม่บังคับโครงสร้าง
  # ============================================================

  discover:
    name: 01 - Discover Project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      android: ${{ steps.detect.outputs.android }}
      web: ${{ steps.detect.outputs.web }}
      node: ${{ steps.detect.outputs.node }}
      security: ${{ steps.detect.outputs.security }}
      integrity: ${{ steps.detect.outputs.integrity }}
      tests: ${{ steps.detect.outputs.tests }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect available components
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          android=false
          web=false
          node=false
          security=false
          integrity=false
          tests=false

          if [[ -f "gradlew" && -f "settings.gradle.kts" ]]; then
            android=true
          fi

          if [[ -f "web/public/index.html" ]]; then
            web=true
          fi

          if [[ -f "package.json" ]]; then
            node=true
          fi

          if [[ -f "scripts/security-preflight.mjs" ]]; then
            security=true
          fi

          if [[ -f "scripts/release-integrity.mjs" ]]; then
            integrity=true
          fi

          if compgen -G "tests/*.test.mjs" > /dev/null; then
            tests=true
          fi

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "security=$security" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

          echo "================================"
          echo "PROJECT DISCOVERY"
          echo "================================"
          echo "Android  : $android"
          echo "Web      : $web"
          echo "Node     : $node"
          echo "Security : $security"
          echo "Integrity: $integrity"
          echo "Tests    : $tests"

  # ============================================================
  # 2. INSPECT → SAFE REPAIR → RECHECK
  # แก้เฉพาะสิ่งที่ CI แก้ได้โดยไม่เปลี่ยน Logic
  # ============================================================

  control:
    name: 02 - Inspect Repair Re-check
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initial inspection
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "INITIAL INSPECTION"
          echo "================================"

          echo ""
          echo "--- Repository root ---"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -300

          echo ""
          echo "--- Available project areas ---"

          [[ "${{ needs.discover.outputs.android }}" == "true" ]] \
            && echo "✓ Android project detected" \
            || echo "- Android project not detected"

          [[ "${{ needs.discover.outputs.web }}" == "true" ]] \
            && echo "✓ Web project detected" \
            || echo "- Web project not detected"

          [[ "${{ needs.discover.outputs.node }}" == "true" ]] \
            && echo "✓ Node project detected" \
            || echo "- Node project not detected"

      - name: Safe repair
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "SAFE REPAIR"
          echo "================================"

          # แก้เฉพาะ permission ที่ปลอดภัย
          if [[ -f "gradlew" && ! -x "gradlew" ]]; then
            echo "Repair: making gradlew executable"
            chmod +x gradlew
          else
            echo "No gradlew permission repair required"
          fi

          # scripts ที่มีอยู่เท่านั้น
          if [[ -d "scripts" ]]; then
            while IFS= read -r -d '' file; do
              if [[ ! -x "$file" ]]; then
                echo "Repair: executable permission -> $file"
                chmod +x "$file"
              fi
            done < <(find scripts -type f \( -name "*.sh" -o -name "*.mjs" \) -print0)
          fi

          echo "Safe repair completed."

      - name: Re-check after repair
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "RE-CHECK"
          echo "================================"

          if [[ -f "gradlew" ]]; then
            test -x gradlew
            echo "✓ gradlew executable"
          fi

          if [[ -f "web/public/index.html" ]]; then
            test -f "web/public/index.html"
            echo "✓ Web entry exists"
          fi

          if [[ -f "package.json" ]]; then
            node --check package.json 2>/dev/null || true
            echo "✓ package.json detected"
          fi

          echo "Re-check completed."

  # ============================================================
  # 3. SECURITY
  # ตรวจสิ่งที่มีจริง
  # ============================================================

  security:
    name: 03 - Security Scan
    needs:
      - discover
      - control
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "SECRET SCAN"
          echo "================================"

          found=0

          if git grep -nE \
            'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            -- ':!*.md' ':!docs/**'; then
            found=1
          fi

          if git grep -nE \
            '(API_KEY|SECRET_KEY|AUTH_TOKEN|ACCESS_TOKEN|PASSWORD|PRIVATE_KEY)[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' \
            -- ':!.env.example' ':!config/env.example' ':!*.md'; then
            found=1
          fi

          if [[ "$found" -ne 0 ]]; then
            echo "::error::Potential credential detected."
            exit 1
          fi

          echo "✓ No obvious credentials detected."

      - name: Foreign and suspicious content scan
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "FOREIGN / SUSPICIOUS CONTENT"
          echo "================================"

          found=0

          if [[ -d "web" ]]; then

            if grep -RInE \
              '<script[^>]+src="https?://|javascript:|data:text/html|eval\(|new Function\(' \
              web \
              --exclude='*.md' \
              --exclude-dir=node_modules; then
              found=1
            fi

          fi

          if [[ "$found" -ne 0 ]]; then
            echo "::error::Suspicious web/runtime pattern detected."
            exit 1
          fi

          echo "✓ Suspicious-content scan passed."

      - name: Project security preflight
        if: needs.discover.outputs.security == 'true'
        run: node scripts/security-preflight.mjs

      - name: Skip security preflight when unavailable
        if: needs.discover.outputs.security != 'true'
        run: |
          echo "Security preflight script not present."
          echo "Skipped — no file was created automatically."

  # ============================================================
  # 4. NODE / WEB
  # มี Node/Web ค่อยตรวจ
  # ============================================================

  web:
    name: 04 - Web Validation
    needs:
      - discover
      - control
      - security
    if: needs.discover.outputs.node == 'true' || needs.discover.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.discover.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Run existing project tests
        if: needs.discover.outputs.tests == 'true'
        run: npm test

      - name: Skip tests when project has none
        if: needs.discover.outputs.tests != 'true'
        run: |
          echo "No tests/*.test.mjs detected."
          echo "Skipped — no tests were invented."

      - name: Verify existing web files
        if: needs.discover.outputs.web == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "WEB VALIDATION"
          echo "================================"

          test -f web/public/index.html

          for file in \
            web/public/app.js \
            web/public/styles.css \
            web/public/_headers
          do
            if [[ -f "$file" ]]; then
              echo "✓ $file"
            else
              echo "- $file not present; not required by CI"
            fi
          done

          echo "Web validation completed."

      - name: Release integrity
        if: needs.discover.outputs.integrity == 'true'
        run: |
          node scripts/release-integrity.mjs \
            --write-manifest \
            --verify-manifest

      - name: Skip release integrity when unavailable
        if: needs.discover.outputs.integrity != 'true'
        run: |
          echo "release-integrity.mjs not present."
          echo "Skipped — no script was invented."

  # ============================================================
  # 5. ANDROID
  # มี Android ค่อยตรวจ
  # ============================================================

  android:
    name: 05 - Android Validation
    needs:
      - discover
      - control
      - security
    if: needs.discover.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Validate resources
        run: ./gradlew processDebugResources

      - name: Run Android lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/apk/**
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # 6. INTEGRITY
  # ตรวจซ้ำก่อนจบ
  # ============================================================

  final-recheck:
    name: 06 - Final Re-check
    needs:
      - discover
      - control
      - security
      - web
      - android
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Final project inspection
        shell: bash
        run: |
          set -euo pipefail

          echo "================================"
          echo "FINAL RE-CHECK"
          echo "================================"

          echo ""
          echo "Component status:"
          echo "Android : ${{ needs.discover.outputs.android }}"
          echo "Web     : ${{ needs.discover.outputs.web }}"
          echo "Node    : ${{ needs.discover.outputs.node }}"
          echo "Security: ${{ needs.discover.outputs.security }}"
          echo "Tests   : ${{ needs.discover.outputs.tests }}"

          echo ""
          echo "Job status:"
          echo "Control  : ${{ needs.control.result }}"
          echo "Security : ${{ needs.security.result }}"
          echo "Web      : ${{ needs.web.result }}"
          echo "Android  : ${{ needs.android.result }}"

      - name: Final secret re-check
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE \
            'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            -- ':!*.md' ':!docs/**'; then
            echo "::error::Credential material detected during final re-check."
            exit 1
          fi

          echo "✓ Final secret re-check passed."

      - name: Final readiness decision
        shell: bash
        run: |
          set -euo pipefail

          # Control และ Security ต้องผ่านเสมอ
          if [[ "${{ needs.control.result }}" != "success" ]]; then
            echo "::error::Control stage failed."
            exit 1
          fi

          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "::error::Security stage failed."
            exit 1
          fi

          # ถ้ามี Android ต้องผ่าน
          if [[ "${{ needs.discover.outputs.android }}" == "true" ]]; then
            if [[ "${{ needs.android.result }}" != "success" ]]; then
              echo "::error::Android project exists but validation failed."
              exit 1
            fi
          fi

          # ถ้ามี Web/Node ต้องผ่าน
          if [[ "${{ needs.discover.outputs.web }}" == "true" || "${{ needs.discover.outputs.node }}" == "true" ]]; then
            if [[ "${{ needs.web.result }}" != "success" ]]; then
              echo "::error::Web/Node project exists but validation failed."
              exit 1
            fi
          fi

          echo ""
          echo "================================"
          echo "SUBERTUBE PROJECT CONTROL"
          echo "================================"
          echo "✓ ตรวจสิ่งที่มี"
          echo "✓ แก้เฉพาะสิ่งที่แก้ได้อย่างปลอดภัย"
          echo "✓ ตรวจซ้ำ"
          echo "✓ Security"
          echo "✓ Regression/Test ตามสิ่งที่มี"
          echo "✓ Final Re-check"
          echo ""
          echo "RESULT: READY"
          echo ""
          echo "ไม่มีการบังคับ Hosting Provider"
          echo "ไม่มีการ Deploy อัตโนมัติ"
          echo "ไม่มีการสร้างไฟล์ที่ Project ไม่มี"