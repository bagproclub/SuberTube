name: SuberTube Project Validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Optional deployed URL for external reputation re-check"
        required: false
        type: string
        default: ""
      external_reputation_result:
        description: "Set PASS only after the real deployed URL has been checked externally"
        required: false
        type: choice
        options:
          - not_checked
          - pass
          - fail
        default: not_checked

concurrency:
  group: subertube-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "24"
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:

  # ============================================================
  # 1. READINESS
  # ตรวจ → แก้เฉพาะสิ่งที่แก้ได้อย่างปลอดภัย → ตรวจซ้ำ
  # ============================================================
  readiness:
    name: Readiness → Safe Repair → Re-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      has_android: ${{ steps.detect.outputs.has_android }}
      has_web: ${{ steps.detect.outputs.has_web }}
      has_node: ${{ steps.detect.outputs.has_node }}

    steps:

      - name: Checkout current workflow revision
        uses: actions/checkout@v7

      - name: Detect project components
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_android=false
          has_web=false
          has_node=false

          [[ -f "gradlew" && -f "settings.gradle.kts" ]] && has_android=true
          [[ -f "web/public/index.html" ]] && has_web=true
          [[ -f "package.json" ]] && has_node=true

          echo "has_android=$has_android" >> "$GITHUB_OUTPUT"
          echo "has_web=$has_web" >> "$GITHUB_OUTPUT"
          echo "has_node=$has_node" >> "$GITHUB_OUTPUT"

          echo "Android project: $has_android"
          echo "Web project:     $has_web"
          echo "Node project:    $has_node"

      # --------------------------------------------------------
      # ห้าม Workflow ผูกกับ commit ใดโดยเฉพาะ
      # --------------------------------------------------------
      - name: Check workflow is not pinned to a project commit
        shell: bash
        run: |
          set -euo pipefail

          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)

          [[ -e "${workflow_files[0]}" ]] || exit 0

          if grep -RInE \
            '(^|[[:space:]])ref:[[:space:]]*[0-9a-f]{40}([[:space:]]|$)|github\.com/[^[:space:]]+/commit/[0-9a-f]{40}' \
            .github/workflows; then

            echo "::error::Workflow contains a hard-pinned project commit reference."
            echo "::error::The workflow must run against the triggering branch/commit by default."
            exit 1
          fi

          echo "No project commit is hard-pinned."

      # --------------------------------------------------------
      # ตรวจครั้งแรก
      # --------------------------------------------------------
      - name: Initial readiness check
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          echo "=== INITIAL READINESS CHECK ==="

          required_files=(
            ".gitignore"
            "README.md"
          )

          if [[ "${{ steps.detect.outputs.has_android }}" == "true" ]]; then
            required_files+=(
              "gradlew"
              "gradle.properties"
              "settings.gradle.kts"
              "build.gradle.kts"
            )
          fi

          if [[ "${{ steps.detect.outputs.has_web }}" == "true" ]]; then
            required_files+=(
              "web/public/index.html"
              "web/public/app.js"
              "web/public/styles.css"
            )
          fi

          missing=0

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          # ----------------------------------------------------
          # Secret-like content
          # ----------------------------------------------------
          echo "=== SECRET-LIKE CONTENT CHECK ==="

          if git grep -nE \
            'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            -- ':!*.md' ':!docs/**'; then

            echo "::error::Potential credential material found in tracked source."
            exit 1
          fi

          if git grep -nE \
            '(API_KEY|SECRET_KEY|AUTH_TOKEN|ACCESS_TOKEN|PASSWORD|PRIVATE_KEY)[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' \
            -- ':!.env.example' ':!config/env.example' ':!*.md' ':!docs/**'; then

            echo "::error::Potential active secret assignment found."
            exit 1
          fi

          # ----------------------------------------------------
          # No YouTube Data API
          # ----------------------------------------------------
          echo "=== SUBERTUBE NO-API BOUNDARY CHECK ==="

          if [[ "${{ steps.detect.outputs.has_web }}" == "true" ]]; then
            if grep -RInE \
              'youtube\.googleapis\.com/youtube/v3|www\.googleapis\.com/youtube/v3|YOUTUBE_DATA_API_KEY|YT_DATA_API_KEY' \
              web --exclude='*.md' --exclude-dir='docs'; then

              echo "::error::YouTube Data API pattern detected in web runtime."
              exit 1
            fi
          fi

          if [[ "${{ steps.detect.outputs.has_android }}" == "true" ]]; then
            if grep -RInE \
              'youtube\.googleapis\.com/youtube/v3|www\.googleapis\.com/youtube/v3|YOUTUBE_DATA_API_KEY|YT_DATA_API_KEY' \
              android app --exclude='*.md' --exclude-dir='docs' 2>/dev/null; then

              echo "::error::YouTube Data API pattern detected in Android source."
              exit 1
            fi
          fi

          echo "Initial readiness check completed."

      # --------------------------------------------------------
      # Safe repair
      # ไม่แก้ Logic ของแอป
      # --------------------------------------------------------
      - name: Safe repair / normalization
        if: steps.preflight.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          echo "=== SAFE REPAIR ==="

          if [[ -f "gradlew" ]]; then
            chmod +x gradlew
          fi

          if [[ -d "scripts" ]]; then
            find scripts \
              -maxdepth 1 \
              -type f \
              -name "*.mjs" \
              -print0 \
              | xargs -0 -r chmod +x
          fi

          echo "Safe repair completed."

      # --------------------------------------------------------
      # ตรวจซ้ำ
      # --------------------------------------------------------
      - name: Re-check readiness
        shell: bash
        run: |
          set -euo pipefail

          echo "=== READINESS RE-CHECK ==="

          required_files=(
            ".gitignore"
            "README.md"
          )

          if [[ "${{ steps.detect.outputs.has_android }}" == "true" ]]; then
            required_files+=(
              "gradlew"
              "gradle.properties"
              "settings.gradle.kts"
              "build.gradle.kts"
            )
          fi

          if [[ "${{ steps.detect.outputs.has_web }}" == "true" ]]; then
            required_files+=(
              "web/public/index.html"
              "web/public/app.js"
              "web/public/styles.css"
            )
          fi

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error file=$file::Readiness re-check failed."
              exit 1
            }
          done

          if [[ "${{ steps.detect.outputs.has_android }}" == "true" ]]; then
            test -x gradlew || {
              echo "::error file=gradlew::gradlew is not executable."
              exit 1
            }
          fi

          if git grep -nE \
            'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            -- ':!*.md' ':!docs/**'; then

            echo "::error::Credential material still present after repair."
            exit 1
          fi

          if git grep -nE \
            '(API_KEY|SECRET_KEY|AUTH_TOKEN|ACCESS_TOKEN|PASSWORD|PRIVATE_KEY)[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' \
            -- ':!.env.example' ':!config/env.example' ':!*.md' ':!docs/**'; then

            echo "::error::Active secret assignment still present after repair."
            exit 1
          fi

          echo "Readiness PASS"
          echo "Safe repair PASS"
          echo "Re-check PASS"


  # ============================================================
  # 2. TEST / SECURITY / INTEGRITY / REGRESSION
  # ============================================================
  verify:
    name: Test → Security → Integrity → Regression
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout current workflow revision
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.readiness.outputs.has_node == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Run project tests
        if: needs.readiness.outputs.has_node == 'true'
        run: npm test

      - name: Run security preflight
        if: needs.readiness.outputs.has_node == 'true' && hashFiles('scripts/security-preflight.mjs') != ''
        run: npm run security

      - name: Verify release integrity
        if: needs.readiness.outputs.has_node == 'true' && hashFiles('scripts/release-integrity.mjs') != ''
        run: |
          node scripts/release-integrity.mjs \
            --write-manifest \
            --verify-manifest

      # --------------------------------------------------------
      # Foreign / suspicious content
      # --------------------------------------------------------
      - name: Foreign-content and suspicious-content review
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FOREIGN / SUSPICIOUS CONTENT REVIEW ==="

          if git grep -nE \
            'javascript:|data:text/html|eval\(|new Function\(' \
            -- web android app ':!*.md' ':!docs/**' 2>/dev/null; then

            echo "::error::Potential unsafe runtime pattern detected."
            exit 1
          fi

          if git grep -nE \
            'curl[[:space:]]+[^[:space:]]+.*\||wget[[:space:]]+[^[:space:]]+.*\||powershell.*-EncodedCommand' \
            -- ':!*.md' ':!docs/**'; then

            echo "::error::Unexpected download/execution pattern detected."
            exit 1
          fi

          echo "=== EXTERNAL URL REVIEW ==="

          if [[ -d "web" ]]; then
            grep -RInE \
              'https?://|ws://|wss://' \
              web \
              --exclude='*.md' || true
          fi

          echo "Suspicious-content review complete."

      - name: Regression summary
        run: |
          echo "## Verification Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Test: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Security: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Foreign-content review: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "URL review: COMPLETE" >> "$GITHUB_STEP_SUMMARY"
          echo "Release integrity: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Regression stage: REACHED" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # 3. ANDROID
  # ============================================================
  android:
    name: Android Validate → Test → Build
    needs: readiness
    if: needs.readiness.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      - name: Checkout current workflow revision
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Java and Gradle
        run: |
          java --version
          ./gradlew --version

      - name: Validate resources
        run: ./gradlew processDebugResources

      - name: Run Android lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android reports and APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/apk/**
          if-no-files-found: warn
          retention-days: 30


  # ============================================================
  # 4. WEB
  # ============================================================
  web:
    name: Web Validate → Package
    needs:
      - readiness
      - verify
    if: needs.readiness.outputs.has_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout current workflow revision
        uses: actions/checkout@v7

      - name: Verify web publish directory
        shell: bash
        run: |
          set -euo pipefail

          test -f web/public/index.html
          test -f web/public/app.js
          test -f web/public/styles.css

          echo "=== WEB SOURCE ==="
          find web/public -maxdepth 2 -type f | sort

      - name: Verify optional security headers file
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "web/public/_headers" ]]; then
            grep -q "Content-Security-Policy" web/public/_headers
            grep -q "X-Content-Type-Options" web/public/_headers
            grep -q "X-Frame-Options" web/public/_headers

            echo "_headers security policy present"
          else
            echo "_headers not present; hosting-specific headers are not required."
          fi

      - name: Create deployment-neutral web artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf web-release
          mkdir -p web-release

          cp -R web/public/. web-release/

          echo "Deployment provider: NONE"
          echo "Artifact contains only the web publish directory."

      - name: Upload deployment-neutral web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: web-release/
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # 5. EXTERNAL URL RE-CHECK
  # ทำเมื่อมี URL Deploy จริงเท่านั้น
  # ============================================================
  external-recheck:
    name: External URL Re-check Gate
    needs:
      - readiness
      - verify
      - android
      - web
    if: >
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deployment_url != ''
    runs-on: ubuntu-latest

    steps:

      - name: Validate supplied deployment URL
        shell: bash
        run: |
          set -euo pipefail

          URL="${{ github.event.inputs.deployment_url }}"
          RESULT="${{ github.event.inputs.external_reputation_result }}"

          if [[ ! "$URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::deployment_url must be an HTTPS URL."
            exit 1
          fi

          echo "Deployment URL:"
          echo "$URL"

          echo "External reputation result:"
          echo "$RESULT"

          if [[ "$RESULT" != "pass" ]]; then
            echo "::error::External reputation re-check is not marked PASS."
            echo "::error::Perform the real URL reputation check first."
            exit 1
          fi

          echo "External re-check gate = PASS"
          echo "This workflow does not claim to have performed an external scanner API call."


  # ============================================================
  # 6. FINAL GATE
  # ============================================================
  final-gate:
    name: Final Gate → Release Ready
    needs:
      - readiness
      - verify
      - android
      - web
      - external-recheck
    if: always()
    runs-on: ubuntu-latest

    steps:

      - name: Evaluate final gate
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "       SUBERTUBE FINAL GATE"
          echo "======================================"

          echo "Readiness:        ${{ needs.readiness.result }}"
          echo "Verification:     ${{ needs.verify.result }}"
          echo "Android:          ${{ needs.android.result }}"
          echo "Web:              ${{ needs.web.result }}"
          echo "External recheck: ${{ needs.external-recheck.result }}"

          if [[ "${{ needs.readiness.result }}" != "success" ]]; then
            echo "::error::Readiness gate failed."
            exit 1
          fi

          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            echo "::error::Verification gate failed."
            exit 1
          fi

          if [[ "${{ needs.android.result }}" == "failure" ]]; then
            echo "::error::Android validation/build failed."
            exit 1
          fi

          if [[ "${{ needs.web.result }}" == "failure" ]]; then
            echo "::error::Web validation failed."
            exit 1