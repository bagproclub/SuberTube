
name: SuberTube Web Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - "web/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "docs/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

concurrency:
  group: subertube-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    name: Verify and Deploy Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node
        run: node --version

      - name: Run project tests
        run: npm test

      - name: Run security preflight
        run: npm run security

      - name: Verify release integrity
        run: node scripts/release-integrity.mjs --write-manifest --verify-manifest

      - name: Verify web publish directory
        run: |
          test -f web/public/index.html
          test -f web/public/app.js
          test -f web/public/styles.css
          test -f web/public/_headers

      - name: Deploy production site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir=web/public \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}