name: Android Release Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Verify Release APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. ดูภาพรวม
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inspect project
        shell: bash
        run: |
          set -e

          echo "=== PROJECT OVERVIEW ==="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo

          echo "=== TOP LEVEL ==="
          find . -maxdepth 2 -type f | sort | head -200

      # ============================================================
      # 2. ตรวจของจริง
      # ============================================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "=== ANDROID PROJECT CHECK ==="

          if [ -f "android/gradlew" ]; then
            echo "Android Gradle Wrapper found"
            echo "GRADLE_PROJECT=android" >> "$GITHUB_ENV"
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"

          elif [ -f "gradlew" ]; then
            echo "Root Gradle Wrapper found"
            echo "GRADLE_PROJECT=." >> "$GITHUB_ENV"
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"

          elif [ -f "android/settings.gradle.kts" ] || [ -f "android/settings.gradle" ]; then
            echo "Android Gradle project found without wrapper"
            echo "GRADLE_PROJECT=android" >> "$GITHUB_ENV"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

          elif [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Root Gradle project found without wrapper"
            echo "GRADLE_PROJECT=." >> "$GITHUB_ENV"
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

          else
            echo "::error::Android Gradle project was not found"
            exit 1
          fi

      # ============================================================
      # 3. มีหลักฐาน
      # ============================================================
      - name: Collect source evidence
        shell: bash
        run: |
          set -e

          echo "=== SOURCE EVIDENCE ==="

          echo "Gradle project:"
          echo "$GRADLE_PROJECT"

          echo
          echo "Important files:"

          find "$GRADLE_PROJECT" \
            -maxdepth 4 \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "AndroidManifest.xml" \
            \) \
            -print | sort

      # ============================================================
      # 4. ตัดสินใจ
      # ============================================================
      - name: Select build path
        shell: bash
        run: |
          set -e

          echo "=== BUILD DECISION ==="

          if [ "$GRADLE_PROJECT" = "android" ]; then
            echo "Using Android project"
          else
            echo "Using repository root Gradle project"
          fi

          if [ "$GRADLE_CMD" = "./gradlew" ]; then
            echo "Using Gradle Wrapper"
          else
            echo "Using installed Gradle"
          fi

      # ============================================================
      # 5. เตรียม Environment
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"

      # ============================================================
      # 6. แก้เท่าที่จำเป็น
      #
      # Workflow ไม่แก้ source code อัตโนมัติ
      # Developer แก้ code ใน repository แล้ว workflow ตรวจ/build
      # ============================================================

      # ============================================================
      # 7. ทดสอบ
      # ============================================================
      - name: Run available source checks
        shell: bash
        run: |
          set -e

          echo "=== TEST / SOURCE CHECK ==="

          if [ -f "package.json" ]; then
            echo "package.json found"

            if node -e '
              const p = require("./package.json");
              process.exit(p.scripts?.test ? 0 : 1);
            '
            then
              echo "Running npm test"
              npm test
            else
              echo "No npm test script - skip"
            fi
          else
            echo "No Node.js project - skip"
          fi

      # ============================================================
      # 8. ตรวจ Security
      # ============================================================
      - name: Run security preflight
        shell: bash
        run: |
          set -e

          if [ -f "security-preflight.mjs" ]; then
            echo "Running security preflight"
            node security-preflight.mjs
          else
            echo "No security-preflight.mjs found - skip"
          fi

      # ============================================================
      # 9. Build
      # ============================================================
      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$GRADLE_PROJECT"

          chmod +x "$GRADLE_CMD"

          echo "=== BUILD RELEASE APK ==="

          "$GRADLE_CMD" :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 10. ตรวจ Artifact
      # ============================================================
      - name: Find release APK
        shell: bash
        run: |
          set -e

          echo "=== SEARCH RELEASE APK ==="

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Release APK:"
          ls -lh "$APK"

      # ============================================================
      # 11. Integrity
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          echo "=== SHA256 ==="

          sha256sum "$APK" | tee APK-SHA256SUM.txt

      - name: Verify APK file
        shell: bash
        run: |
          set -e

          test -s "$APK"

          echo "APK exists and is not empty"
          echo "SHA256:"
          cat APK-SHA256SUM.txt

      # ============================================================
      # 12. ส่ง Artifact
      # ============================================================
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            ${{ env.APK }}
            APK-SHA256SUM.txt
          if-no-files-found: error
          retention-days: 14