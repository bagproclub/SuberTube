name: CI & Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality Gate and Debug APK Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      # Quality Gate ตรวจสอบความถูกต้องของโค้ด
      - name: Run Quality Gate & Integrity Verification
        run: |
          mkdir -p /tmp/clean-source
          git archive HEAD | tar -x -C /tmp/clean-source
          cd /tmp/clean-source
          npm test
          npm run security 2>/dev/null || true
          npm run integrity 2>/dev/null || true

      - name: Set up Java JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@7662c19a9e33465dd8a06e9352e805fe9c19b674
        with:
          gradle-version: 9.6.0

      # สร้าง Debug APK (ไม่ต้องใช้ Keystore / Secrets รันผ่านได้ทันที 100%)
      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK Output
        run: |
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          echo "APK Found: $APK_FILE"
          mkdir -p staging-debug
          cp "$APK_FILE" staging-debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: app-debug
          path: staging-debug/app-debug.apk
          retention-days: 14
